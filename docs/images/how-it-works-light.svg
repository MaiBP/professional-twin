<title id="t">How Professional Twin works</title>
<desc id="d">Architecture: you use a browser app, which talks to a local server, which launches Claude Code (your twin), which reads and writes your private Markdown files. Everything runs on your PC; Claude Code reaches Anthropic through your own account.</desc>
