<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d">
<title id="t">What happens when you press a button</title>
<desc id="d">Sequence diagram in six steps: you press a button in the browser; the local server checks your Claude account; it launches claude -p with a skill and project id; Claude reads and writes your local files; steps stream back live; the app re-reads the files and updates the tabs, saving the chat in conversation.json.</desc>
