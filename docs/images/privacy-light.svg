<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 486" width="960" height="486" role="img" aria-labelledby="t d">
<title id="t">Privacy by design</title>
<desc id="d">Privacy diagram: a boundary around your PC containing your private files, the local app, Claude Code and backups. Only the text needed for a task goes to Anthropic through your own Claude account. Nothing goes to the GitHub repository, which holds code only.</desc>
<defs>
<linearGradient id="gAcc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5b5bd6"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#0f9488"/></linearGradient>
<linearGradient id="gInd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b5bd6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
<linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f9488"/><stop offset="1" stop-color="#5b5bd6"/></linearGradient>
<linearGradient id="gBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f5f6fc"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1c2142" flood-opacity="0.1"/></filter>
<marker id="aI" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#5b5bd6"/></marker>
<marker id="aT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#0f9488"/></marker>
<marker id="aV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#8b5cf6"/></marker>
<marker id="aM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#c4c9df"/></marker>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1c2142}
.ttl{font-size:21px;font-weight:800}
.sub{font-size:14px;fill:#596084}
.h{font-size:15.5px;font-weight:700}
.s{font-size:13px;fill:#596084}
.m{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace;font-size:13px}
.b{font-weight:700}
.card{fill:#ffffff;stroke:#e1e4f0;stroke-width:1.2}
.ln{fill:none;stroke:#c4c9df;stroke-width:2}
.flow{fill:none;stroke-width:2;stroke-dasharray:6 7;animation:flow 1.3s linear infinite}
.dot{fill:none;stroke-linecap:round;stroke-width:9}
.tail{fill:none;stroke-linecap:round;stroke-width:3.5;opacity:.3}
.fade{animation:fadeup .9s cubic-bezier(.2,.7,.2,1) both}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-13}}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.18);opacity:.35}}
@keyframes c0{from{stroke-dashoffset:30}to{stroke-dashoffset:-176}}
.c0{animation:c0 2.1s linear 0s infinite}
@keyframes c0x{from{stroke-dashoffset:4}to{stroke-dashoffset:-202}}@keyframes c1{from{stroke-dashoffset:30}to{stroke-dashoffset:-176}}
.c1{animation:c1 2.1s linear 0.7s infinite}
@keyframes c1x{from{stroke-dashoffset:4}to{stroke-dashoffset:-202}}@keyframes c2{from{stroke-dashoffset:30}to{stroke-dashoffset:-176}}
.c2{animation:c2 2.1s linear 1.4s infinite}
@keyframes c2x{from{stroke-dashoffset:4}to{stroke-dashoffset:-202}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.dot,.tail{display:none}}
</style>
<rect x="1" y="1" width="958" height="484" rx="18" fill="url(#gBg)" stroke="#e1e4f0"/>
<text x="32" y="42" class="ttl">Privacy by design</text><text x="32" y="65" class="sub">Your data stays on your PC. Only the text a task needs goes to Claude.</text><rect x="24" y="100" width="420" height="286" rx="22" class="flow" style="fill:#f7f8fd;stroke:#0f9488;stroke-width:2"/><g class="fade"><rect x="46" y="85" width="139" height="30" rx="15" fill="#e6faf6" stroke="#0f9488"/><g class="pulse"><g fill="none" stroke="#0f9488" stroke-width="2" stroke-linejoin="round"><rect x="60" y="97" width="16" height="12" rx="2.5"/><path d="M64 97V94a4 4 0 0 1 8 0v3"/></g></g><text x="86" y="105" class="b" style="font-size:14.5px;fill:#0f9488">On your PC</text></g><g class="fade" style="animation-delay:.15s"><rect x="42" y="130" width="190" height="238" rx="14" class="card" filter="url(#sh)" /><rect x="54" y="142" width="36" height="36" rx="10" fill="#e6faf6"/><g fill="none" stroke="#0f9488" stroke-width="2" stroke-linejoin="round"><path d="M65 150h9l5 5v15H65z"/><path d="M74 150v5h5M68 161h8M68 165h6"/></g><text x="98" y="165" class="h" style="font-size:15px">Private files</text></g><text x="56" y="200" class="s">git-ignored, never uploaded</text><g class="fade" style="animation-delay:0.40s"><rect x="56" y="213" width="4" height="16" rx="2" fill="#5b5bd6"/><text x="68" y="226" class="m">profile/</text></g><g class="fade" style="animation-delay:0.52s"><rect x="56" y="234" width="4" height="16" rx="2" fill="#8b5cf6"/><text x="68" y="247" class="m">context/</text></g><g class="fade" style="animation-delay:0.64s"><rect x="56" y="255" width="4" height="16" rx="2" fill="#5b5bd6"/><text x="68" y="268" class="m">journal/</text></g><g class="fade" style="animation-delay:0.76s"><rect x="56" y="276" width="4" height="16" rx="2" fill="#8b5cf6"/><text x="68" y="289" class="m">projects/</text></g><g class="fade" style="animation-delay:0.88s"><rect x="56" y="297" width="4" height="16" rx="2" fill="#5b5bd6"/><text x="68" y="310" class="m">cv/</text></g><g class="fade" style="animation-delay:1.00s"><rect x="56" y="318" width="4" height="16" rx="2" fill="#8b5cf6"/><text x="68" y="331" class="m">offers/</text></g><g class="fade" style="animation-delay:1.12s"><rect x="56" y="339" width="4" height="16" rx="2" fill="#5b5bd6"/><text x="68" y="352" class="m">settings.json</text></g><g class="fade" style="animation-delay:0.25s"><rect x="246" y="130" width="180" height="70" rx="14" class="card" filter="url(#sh)" /><rect x="256" y="147" width="36" height="36" rx="10" fill="#f4efff"/><g fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linejoin="round"><rect x="264" y="157" width="20" height="16" rx="3"/><path d="M264 162h20"/></g><circle cx="267.5" cy="159.6" r="1" fill="#8b5cf6"/><circle cx="270.5" cy="159.6" r="1" fill="#8b5cf6"/><text x="300" y="161" class="h" style="font-size:15px">Local app</text><text x="300" y="181" class="s">localhost:3210</text></g><g class="fade" style="animation-delay:0.40s"><rect x="246" y="214" width="180" height="70" rx="14" class="card" filter="url(#sh)" /><rect x="256" y="231" width="36" height="36" rx="10" fill="#eef0ff"/><path d="M274 239l2.6 6.8 6.9 2.7-6.9 2.7L274 258l-2.6-6.8-6.9-2.7 6.9-2.7z" fill="#5b5bd6"/><text x="300" y="245" class="h" style="font-size:15px">Claude Code</text><text x="300" y="265" class="s">signed in by you</text></g><g class="fade" style="animation-delay:0.55s"><rect x="246" y="298" width="180" height="70" rx="14" class="card" filter="url(#sh)" /><rect x="256" y="315" width="36" height="36" rx="10" fill="#e6faf6"/><g fill="none" stroke="#0f9488" stroke-width="2" stroke-linejoin="round"><rect x="266" y="323" width="16" height="20" rx="2"/><path d="M274 323v3M274 328v2M274 332v2"/><rect x="272" y="335" width="4" height="4" rx="1"/></g><text x="300" y="329" class="h" style="font-size:15px">Backups</text><text x="300" y="349" class="s">.zip you download</text></g><g class="fade" style="animation-delay:.6s"><rect x="616" y="195" width="320" height="108" rx="14" class="card" filter="url(#sh)" /><rect x="616" y="195" width="5" height="108" rx="2.5" fill="url(#gInd)"/><rect x="634" y="213" width="36" height="36" rx="10" fill="#eef0ff"/><path d="M647 238h11a4.5 4.5 0 0 0 .6-9 6 6 0 0 0-11.5-1.5A5 5 0 0 0 647 238z" fill="none" stroke="#5b5bd6" stroke-width="2" stroke-linejoin="round"/><text x="680" y="233" class="h" style="font-size:17px">Anthropic</text><text x="634" y="269" class="s" style="fill:#1c2142">via your own Claude account</text><text x="634" y="289" class="s">subscription or Console</text></g><path d="M432 249H608" stroke="#5b5bd6" stroke-width="2.4" fill="none" marker-end="url(#aI)"/><path class="tail c0 " d="M432 249H608" stroke="#5b5bd6" stroke-dasharray="26 236"/><path class="dot c0 " d="M432 249H608" stroke="#5b5bd6" stroke-dasharray="0.1 261.9" style="animation-name:c0x"/><path class="tail c1 " d="M432 249H608" stroke="#5b5bd6" stroke-dasharray="26 236"/><path class="dot c1 " d="M432 249H608" stroke="#5b5bd6" stroke-dasharray="0.1 261.9" style="animation-name:c1x"/><path class="tail c2 " d="M432 249H608" stroke="#5b5bd6" stroke-dasharray="26 236"/><path class="dot c2 " d="M432 249H608" stroke="#5b5bd6" stroke-dasharray="0.1 261.9" style="animation-name:c2x"/><text x="520" y="215" text-anchor="middle" class="b" style="font-size:13.5px;fill:#5b5bd6;paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round">only the text needed</text><text x="520" y="234" text-anchor="middle" class="b" style="font-size:13.5px;fill:#5b5bd6;paint-order:stroke;stroke:#ffffff;stroke-width:6px;stroke-linejoin:round">for the task</text><g class="fade" style="animation-delay:.8s"><rect x="616" y="327" width="320" height="74" rx="14" class="card" filter="url(#sh)" /><rect x="634" y="346" width="36" height="36" rx="10" fill="#f5f6fc"/><g fill="none" stroke="#596084" stroke-width="2" stroke-linecap="round"><circle cx="647" cy="358" r="2.5"/><circle cx="647" cy="371" r="2.5"/><circle cx="657" cy="362" r="2.5"/><path d="M647 360.5v8M657 364.5c0 3-4 3.5-8.5 5"/></g><text x="680" y="359" class="h">GitHub repository</text><text x="680" y="380" class="s">code only, never your data</text></g><path d="M432 333C502 333 526 364 608 364" fill="none" stroke="#596084" stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round" opacity=".55"/><circle cx="520" cy="348.5" r="22" fill="#dc2626" opacity=".18" class="pulse"/><circle cx="520" cy="348.5" r="15" fill="#fdecec" stroke="#dc2626" stroke-width="2"/><path d="M514 342.5l12 12M526 342.5l-12 12" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round"/><text x="480" y="438" text-anchor="middle" class="s" style="font-size:13.5px">No uploads to the project repo · backups are local .zip files you download</text><text x="480" y="460" text-anchor="middle" class="s" style="font-size:13.5px">The app stores no credentials: login is handled by Claude Code</text>
</svg>
