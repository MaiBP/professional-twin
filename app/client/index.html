<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Professional Twin</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='12' cy='16' r='9' fill='%234f46e5'/><circle cx='20' cy='16' r='9' fill='%2306b6d4' fill-opacity='.8'/></svg>" />
    <script>
      // Applies the saved theme and language before painting, to avoid a flash (the server confirms afterwards).
      try {
        var s = JSON.parse(localStorage.getItem('twin-settings') || '{}');
        if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme;
        if (s.language === 'es') { document.documentElement.lang = 'es'; document.title = 'Gemelo profesional'; }
      } catch (e) { /* no storage */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
